{% extends "base.html" %}

{% block title %}Processando - Processador XML SOAP{% endblock %}

{% block extra_head %}
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .progress-container {
        background: white;
        padding: 60px;
        border-radius: 12px;
        min-width: 600px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        text-align: center;
    }

    .progress-title {
        font-size: 2rem;
        color: #667eea;
        margin-bottom: 30px;
    }

    .progress-message {
        font-size: 1.1rem;
        color: #666;
        margin-bottom: 25px;
        min-height: 60px;
        font-weight: 500;
        white-space: pre-line;
        line-height: 1.6;
    }

    .progress-bar-container {
        background: #e9ecef;
        border-radius: 10px;
        height: 40px;
        overflow: hidden;
        margin-bottom: 15px;
    }

    .progress-bar {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        height: 100%;
        width: 0%;
        transition: width 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 1.1rem;
    }

    .progress-stats {
        text-align: center;
        color: #666;
        font-size: 1rem;
        margin-top: 10px;
    }

    .info-panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 25px;
        padding: 20px;
        background: #f8f9ff;
        border-radius: 8px;
        border: 2px solid #667eea;
    }

    .info-item {
        text-align: center;
    }

    .info-label {
        font-size: 0.9rem;
        color: #666;
        margin-bottom: 5px;
    }

    .info-value {
        font-size: 1.8rem;
        font-weight: bold;
        color: #667eea;
    }

    .spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(102, 126, 234, 0.3);
        border-radius: 50%;
        border-top-color: #667eea;
        animation: spin 1s ease-in-out infinite;
        margin-left: 10px;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
{% endblock %}

{% block content %}
<div class="progress-container">
    <div class="progress-title">
        🔄 Processando XML
    </div>

    <!-- Painel de Informações -->
    <div class="info-panel">
        <div class="info-item">
            <div class="info-label">📄 Total de Publicações</div>
            <div class="info-value" id="total-publicacoes">-</div>
        </div>
        <div class="info-item">
            <div class="info-label">🔄 Grupos Duplicados</div>
            <div class="info-value" id="grupos-duplicatas">-</div>
        </div>
    </div>

    <div class="progress-message" id="progress-message">
        Iniciando processamento...
    </div>
    <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar">0%</div>
    </div>
    <div class="progress-stats" id="progress-stats">
        Aguarde...
    </div>

    <button id="btn-cancelar" class="btn-cancelar" onclick="cancelarProcessamento()">
        ❌ Cancelar e Ver Relatório Parcial
    </button>
</div>

<style>
    .btn-cancelar {
        margin-top: 30px;
        padding: 15px 30px;
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
    }

    .btn-cancelar:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
    }

    .btn-cancelar:active {
        transform: translateY(0);
    }

    .btn-cancelar:disabled {
        background: #ccc;
        cursor: not-allowed;
        box-shadow: none;
    }
</style>

<script>
    const sessionId = '{{ session_id }}';
    let progressInterval = null;

    function cancelarProcessamento() {
        if (confirm('Deseja realmente cancelar o processamento e ver o relatório parcial?')) {
            const btnCancelar = document.getElementById('btn-cancelar');
            btnCancelar.disabled = true;
            btnCancelar.textContent = '⏳ Cancelando...';

            fetch('/cancelar?session_id=' + sessionId, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.sucesso) {
                        document.getElementById('progress-message').textContent =
                            '⚠️ Processamento cancelado! Gerando relatório parcial...';
                    }
                })
                .catch(error => {
                    console.error('Erro ao cancelar:', error);
                    alert('Erro ao cancelar processamento');
                    btnCancelar.disabled = false;
                    btnCancelar.textContent = '❌ Cancelar e Ver Relatório Parcial';
                });
        }
    }

    function checkProgress() {
        fetch('/progresso?session_id=' + sessionId)
            .then(response => response.json())
            .then(data => {
                if (data.erro) {
                    document.getElementById('progress-message').innerHTML =
                        '❌ Erro: ' + data.erro;
                    document.getElementById('btn-cancelar').disabled = true;
                    if (progressInterval) {
                        clearInterval(progressInterval);
                    }
                    setTimeout(() => {
                        window.location.href = '{{ url_for("index") }}';
                    }, 3000);
                    return;
                }

                // Atualiza elementos da barra de progresso
                const progressBar = document.getElementById('progress-bar');
                const progressMessage = document.getElementById('progress-message');
                const progressStats = document.getElementById('progress-stats');
                const totalPublicacoes = document.getElementById('total-publicacoes');
                const gruposDuplicatas = document.getElementById('grupos-duplicatas');

                progressBar.style.width = data.porcentagem + '%';
                progressBar.textContent = data.porcentagem + '%';

                let mensagem = data.mensagem || 'Processando...';
                // Usa textContent para preservar quebras de linha (\n)
                progressMessage.textContent = mensagem;

                // Atualiza painel de informações
                if (data.total_publicacoes) {
                    totalPublicacoes.textContent = data.total_publicacoes.toLocaleString('pt-BR');
                }
                if (data.grupos_duplicatas !== undefined) {
                    gruposDuplicatas.textContent = data.grupos_duplicatas.toLocaleString('pt-BR');
                }

                if (data.atual && data.total) {
                    progressStats.textContent = data.atual + ' / ' + data.total + ' comparações realizadas';
                } else {
                    progressStats.textContent = 'Processando...';
                }

                // Se concluído, redireciona para o relatório
                if (data.concluido || data.porcentagem >= 100) {
                    document.getElementById('btn-cancelar').disabled = true;
                    if (progressInterval) {
                        clearInterval(progressInterval);
                    }

                    progressMessage.textContent = '✅ Processamento concluído! Redirecionando...';

                    setTimeout(() => {
                        window.location.href = '{{ url_for("relatorio") }}';
                    }, 1500);
                }
            })
            .catch(error => {
                console.error('Erro ao verificar progresso:', error);
            });
    }

    // Inicia monitoramento imediatamente
    checkProgress();
    progressInterval = setInterval(checkProgress, 500);
</script>
{% endblock %}
